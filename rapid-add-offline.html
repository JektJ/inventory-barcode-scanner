<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapid Inventory Add</title>
<style>

    body {
      background-color: #111111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    #locationBanner {
      padding: 20px;
      margin: 20px 0;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border: 3px solid #333;
      border-radius: 8px;
      background-color: #f2f2f2;
      color: #111111;
    }

    .field {
      margin: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      white-space: pre-line;
    }
  /* ============================================================
   QUANTITY 10-KEY POPUP
   ============================================================ */

.quantity-popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.quantity-keypad {
  width: 90%;
  max-width: 360px;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-sizing: border-box;
}

.quantity-display {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 15px;
}

.keypad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.keypad-grid button {
  margin: 0;
  padding: 18px;
  font-size: 26px;
}

.keypad-add {
  margin-top: 12px;
  font-size: 22px;
}
  
/* High-contrast quantity readout above the keypad. */
.quantity-display {
  background: #f2f2f2;
  color: #111111;
  border: 2px solid #333333;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 15px;
}
.quantity-label { font-size: 18px; margin-bottom: 6px; }
#quantityDisplay {
  display: block;
  font-size: 48px;
  font-weight: bold;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.quantity-keypad { color: #111111; }
</style>
</head>
<body>

  <h1>Rapid Inventory Add Offline</h1>


  <!-- ========================================================
       CURRENT LOCATION
       ======================================================== -->

  <div id="locationBanner">
    NO LOCATION SELECTED
  </div>


  <div class="field">

    <label for="location">
      Location
    </label>

    <input type="text" id="location" placeholder="Scan or enter location" oninput="this.value = this.value.toUpperCase()" onkeydown="handleLocationEnter(event)">
    
    <button tabindex="-1" onclick="lockLocation()">
      USE LOCATION
    </button>

  </div>


  <!-- ========================================================
       PART NUMBER
       ======================================================== -->

  <div class="field">

    <label for="partNumber">
      Part Number
    </label>

    <input type="text" id="partNumber" placeholder="Scan or enter part number" oninput="this.value = this.value.toUpperCase()">

  </div>


  <!-- ========================================================
       QUANTITY
       ======================================================== -->

  <div class="field">

    <label for="quantity">
      Quantity
    </label>

    <input type="number" id="quantity" min="1" inputmode="none" placeholder="Enter quantity" readonly="" onclick="showQuantityKeypad()">

  </div>

  <!-- ========================================================
     QUANTITY 10-KEY POPUP
     ======================================================== -->

<div id="quantityPopup" class="quantity-popup">

  <div class="quantity-keypad">

    <div class="quantity-display" aria-live="polite" aria-atomic="true">
      <div class="quantity-label">QUANTITY</div>
      <div id="quantityDisplay">0</div>
    </div>

    <div class="keypad-grid">

      <button type="button" onclick="enterQuantity('1')">1</button>
      <button type="button" onclick="enterQuantity('2')">2</button>
      <button type="button" onclick="enterQuantity('3')">3</button>

      <button type="button" onclick="enterQuantity('4')">4</button>
      <button type="button" onclick="enterQuantity('5')">5</button>
      <button type="button" onclick="enterQuantity('6')">6</button>

      <button type="button" onclick="enterQuantity('7')">7</button>
      <button type="button" onclick="enterQuantity('8')">8</button>
      <button type="button" onclick="enterQuantity('9')">9</button>

      <button type="button" onclick="clearQuantity()">CLR</button>
      <button type="button" onclick="enterQuantity('0')">0</button>
      <button type="button" onclick="backspaceQuantity()">⌫</button>

    </div>

    <button type="button" class="keypad-add" onclick="submitQuantity()">
      ADD INVENTORY
    </button>

    <button type="button" onclick="hideQuantityKeypad()">
      CANCEL
    </button>

  </div>

</div>

  <button onclick="testAdd()">
    ADD INVENTORY
  </button>


  <button onclick="changeLocation()">
    CHANGE LOCATION
  </button>
  <!-- ========================================================
     OFFLINE TRANSACTION VIEWER
     ======================================================== -->

<button type="button" onclick="togglePendingTransactions()">
  VIEW PENDING
</button>
<button type="button" onclick="exportPendingBackup()">
  EXPORT BACKUP
</button>

<div id="pendingViewer" style="display: none;">

  <h2>Pending Transactions</h2>

  <div id="pendingList"></div>

</div>

  <div id="status">OFFLINE MODE<br>Pending transactions: 0</div>


  <script>

    // ============================================================
    // TEST SYNC: fixed fake record; never reads or changes the local queue.
    function testSyncConnection() {
      const endpoint = "https://script.google.com/macros/s/AKfycbzzF0rS6uQhpQ1KE-wgI6mHj0aK3yRPs-UNWOPEoBp0IyOMi30TA-bY2IkkIqnTEJGz/exec";
      const params = new URLSearchParams({

    // RAPID ADD WORKFLOW STATE
    // ============================================================

    let lockedLocation = "";
    // ============================================================
// OFFLINE QUEUE STATUS
// ============================================================

function showPendingCount() {

  const status =
    document.getElementById("status");

  try {

    const saved =
      localStorage.getItem("rapidAddOfflineQueueV1");

    const queue =
      saved === null ? [] : JSON.parse(saved);

    if (!Array.isArray(queue)) {
      throw new Error("Invalid offline queue.");
    }

    // Count only transactions awaiting synchronization.
    const pendingCount = queue.filter(function(item) {
      return item.status === "PENDING";
    }).length;

    // Count successfully synchronized transactions.
    const syncedCount = queue.filter(function(item) {
      return item.status === "SYNCED";
    }).length;

    status.innerText =
      "OFFLINE MODE\n" +
      "Pending transactions: " + pendingCount + "\n" +
      "Synced transactions: " + syncedCount;

  } catch (error) {

    status.innerText =
      "QUEUE ERROR\n" +
      error.message;

  }

} // end showPendingCount()

/* ============================================================
   VIEW PENDING TRANSACTIONS
   ============================================================ */

function togglePendingTransactions() {

  const viewer =
    document.getElementById("pendingViewer");

  if (viewer.style.display === "none") {

    showPendingTransactions();

    viewer.style.display = "block";

  } else {

    viewer.style.display = "none";

  }

} // end togglePendingTransactions()


function showPendingTransactions() {

  const list =
    document.getElementById("pendingList");

  // Clear the previous display.
  list.replaceChildren();

  try {

    const saved =
      localStorage.getItem("rapidAddOfflineQueueV1");

    const queue =
      saved === null ? [] : JSON.parse(saved);

    if (!Array.isArray(queue)) {
      throw new Error("Invalid offline queue.");
    }

    // Cancelled scans are retained for audit/backup but hidden from the active list.
    const visibleQueue = queue.filter(function(t) {
      return t.status !== "CANCELLED";
    });

    if (visibleQueue.length === 0) {
      list.innerText = "No active transactions.";
      return;
    }

    visibleQueue.forEach(function(transaction, index) {

      const item =
        document.createElement("div");

      item.style.border =
        "1px solid #aaa";

      item.style.borderRadius =
        "8px";

      item.style.padding =
        "12px";

      item.style.marginBottom =
        "10px";

      item.style.background =
        "#202020";

      item.style.color =
        "#ffffff";

      // Use textContent so scanned values are displayed
      // as text rather than interpreted as HTML.
      item.textContent =
        (index + 1) + ". " +
        transaction.partNumber + "\n" +
        "Location: " + transaction.location + "\n" +
        "Quantity: " + transaction.quantity + "\n" +
        "Status: " + transaction.status +
          (transaction.status === "SYNCED"
            ? "\nConfirmed by Google Sheets"
            : "");
      item.style.whiteSpace =
        "pre-line";

      // Only pending scans may be cancelled. Use the unique transaction ID,
      // never the part number or display position.
      if (transaction.status === "PENDING" && typeof transaction.id === "string") {
        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.textContent = "REMOVE THIS PENDING SCAN";
        removeButton.style.backgroundColor = "#8b2020";
        removeButton.style.color = "#ffffff";
        removeButton.onclick = function() {
          cancelPendingTransaction(transaction.id);
        };
        item.appendChild(removeButton);
      }

      list.appendChild(item);
      list.style.display = "block";
      list.style.visibility = "visible";

    });

  } catch (error) {

    list.innerText =
      "Unable to read pending transactions.\n" +
      error.message;

  }

} // end showPendingTransactions()

/* ============================================================
   CANCEL ONE PENDING SCAN
   Keep original data for backup/audit; never affect Google Sheets.
   ============================================================ */
function cancelPendingTransaction(transactionId) {
  const key = "rapidAddOfflineQueueV1";
  const status = document.getElementById("status");
  try {
    const saved = localStorage.getItem(key);
    if (saved === null) throw new Error("Offline queue missing.");
    const queue = JSON.parse(saved);
    if (!Array.isArray(queue)) throw new Error("Invalid offline queue.");

    const matches = queue.filter(function(t) { return t.id === transactionId; });
    if (matches.length !== 1 || matches[0].status !== "PENDING") {
      throw new Error("This scan is no longer uniquely pending. Nothing changed.");
    }
    const t = matches[0];
    const approved = window.confirm(
      "REMOVE THIS PENDING SCAN?\n\n" +
      "Part: " + t.partNumber + "\n" +
      "Location: " + t.location + "\n" +
      "Quantity: " + t.quantity + "\n\n" +
      "This cancels only this scan. It will NOT change Google Sheets."
    );
    if (!approved) return;

    // Re-read after confirmation; reject if the record changed meanwhile.
    const latest = JSON.parse(localStorage.getItem(key));
    if (!Array.isArray(latest)) throw new Error("Invalid offline queue.");
    const latestMatches = latest.filter(function(x) { return x.id === transactionId; });
    if (latestMatches.length !== 1 || latestMatches[0].status !== "PENDING" ||
        latestMatches[0].partNumber !== t.partNumber ||
        latestMatches[0].location !== t.location ||
        latestMatches[0].quantity !== t.quantity) {
      throw new Error("Scan changed during confirmation. Nothing changed.");
    }
    const updated = latest.map(function(x) {
      return x.id === transactionId
        ? Object.assign({}, x, {status: "CANCELLED", cancelledAt: new Date().toISOString()})
        : x;
    });
    localStorage.setItem(key, JSON.stringify(updated));
    showPendingCount();
    showPendingTransactions();
  } catch (error) {
    status.innerText = "REMOVE FAILED\n" + error.message;
  }
}

/* ============================================================
   EXPORT OFFLINE TRANSACTION BACKUP
   ============================================================ */

function exportPendingBackup() {

  const status =
    document.getElementById("status");

  try {

    const saved =
      localStorage.getItem("rapidAddOfflineQueueV1");

    if (saved === null) {
      status.innerText = "No transactions to back up.";
      return;
    }

    const queue = JSON.parse(saved);

    if (!Array.isArray(queue)) {
      throw new Error("Invalid offline queue.");
    }

    if (queue.length === 0) {
      status.innerText = "No transactions to back up.";
      return;
    }

    // Preserve the exact stored transactions and their IDs.
    const backup = {
      format: "RapidAddOfflineBackupV1",
      exportedAt: new Date().toISOString(),
      transactions: queue
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;

    link.download =
      "rapid-add-backup-" +
      new Date().toISOString().replace(/[:.]/g, "-") +
      ".json";

    document.body.appendChild(link);
    link.click();
    link.remove();

    // Allow the browser time to initiate the download.
    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 60000);

    status.innerText =
      "BACKUP DOWNLOAD REQUESTED\n" +
      "Transactions: " + queue.length +
      "\nVerify the file was saved before relying on it.";

  } catch (error) {

    status.innerText =
      "BACKUP FAILED\n" + error.message;

  }

} // end exportPendingBackup()


    // ============================================================
    // LOCK LOCATION
    // ============================================================
    
    // ============================================================
    // LOCATION SCAN-GUN ENTER
    // The Bluetooth scanner sends CR / Enter after a scan.
    // Treat Enter exactly like clicking USE LOCATION.
    // ============================================================

    function handleLocationEnter(event) {

      if (event.key === "Enter") {

        // Prevent the browser from treating Enter as a normal
        // button press or moving focus somewhere unexpected.
        event.preventDefault();


        // Lock the scanned location and move focus to Part Number.
        lockLocation();

      } // end Enter key check

    } // end handleLocationEnter()
    
    function lockLocation() {

      const location =
        document.getElementById("location").value.trim();

      if (!location) {

        document.getElementById("status").innerText =
          "Scan or enter a location first.";

        return;

      } // end blank location check


      lockedLocation =
        location.toUpperCase();


      document.getElementById("location").value =
        lockedLocation;


      document.getElementById("location").disabled =
        true;


      document.getElementById("locationBanner").innerText =
        "CURRENT LOCATION: " + lockedLocation;


      document.getElementById("status").innerText =
        "Location locked.";


      // Wait until the scanner's Enter event has completely finished,
      // then place the cursor in Part Number.

      setTimeout(function() {

        document.getElementById("partNumber").focus();

      }, 100);

    } // end lockLocation()
    // ============================================================
// QUANTITY 10-KEY POPUP
// ============================================================

function showQuantityKeypad() {

  document.getElementById("quantityPopup").style.display =
    "flex";

  updateQuantityDisplay();

} // end showQuantityKeypad()


function hideQuantityKeypad() {

  document.getElementById("quantityPopup").style.display =
    "none";

} // end hideQuantityKeypad()


function enterQuantity(number) {

  const quantity =
    document.getElementById("quantity");

  quantity.value =
    quantity.value + number;

  updateQuantityDisplay();

} // end enterQuantity()


function backspaceQuantity() {

  const quantity =
    document.getElementById("quantity");

  quantity.value =
    quantity.value.slice(0, -1);

  updateQuantityDisplay();

} // end backspaceQuantity()


function clearQuantity() {

  document.getElementById("quantity").value =
    "";

  updateQuantityDisplay();

} // end clearQuantity()


function updateQuantityDisplay() {

  const quantity =
    document.getElementById("quantity").value;

  document.getElementById("quantityDisplay").innerText =
    quantity || "0";

} // end updateQuantityDisplay()


function submitQuantity() {

  const quantity =
    document.getElementById("quantity").value;

  if (!quantity || Number(quantity) <= 0) {

    document.getElementById("status").innerText =
      "Enter a valid quantity.";

    return;

  } // end quantity check

  hideQuantityKeypad();

  testAdd();

} // end submitQuantity()

// ============================================================
// ADD INVENTORY
// Sends one ADD transaction to the existing Apps Script backend.
// After success, Location stays locked while Part and Quantity clear.
// ============================================================


/* ============================================================
   OFFLINE ADD INVENTORY
   Saves locally. Does NOT contact Google Sheets.
   ============================================================ */

function testAdd() {

  const partNumber =
    document.getElementById("partNumber").value.trim().toUpperCase();

  const quantity =
    Number(document.getElementById("quantity").value);

  const status =
    document.getElementById("status");

  // Validate the transaction.

  if (!lockedLocation) {
    status.innerText = "Choose a location first.";
    return;
  }

  if (!partNumber) {
    status.innerText = "Scan or enter a part number.";
    return;
  }

  if (!Number.isSafeInteger(quantity) || quantity <= 0) {
    status.innerText = "Enter a valid whole-number quantity.";
    return;
  }

  // Read the existing local queue.

  const storageKey = "rapidAddOfflineQueueV1";

  let queue;

  try {
    const saved = localStorage.getItem(storageKey);
    queue = saved === null ? [] : JSON.parse(saved);

    if (!Array.isArray(queue)) {
      throw new Error("Stored queue is invalid.");
    }

    if (!crypto.randomUUID) {
      throw new Error("This browser cannot generate transaction IDs.");
    }

    // Create one uniquely identified transaction.

    const transaction = {
      id: crypto.randomUUID(),
      action: "ADD",
      partNumber: partNumber,
      location: lockedLocation,
      quantity: quantity,
      createdAt: new Date().toISOString(),
      status: "PENDING"
    };

    queue.push(transaction);

    // Save the updated queue on this device.

    localStorage.setItem(
      storageKey,
      JSON.stringify(queue)
    );

  } catch (error) {

    status.innerText =
      "LOCAL SAVE FAILED\n" +
      error.message +
      "\nDo not scan this box again until resolved.";

    return;
  }

  // Saved successfully. Clear only Part and Quantity.

  document.getElementById("partNumber").value = "";
  document.getElementById("quantity").value = "";

  status.innerText =
    "SAVED OFFLINE\n" +
    "Location: " + lockedLocation + "\n" +
    "Part: " + partNumber + "\n" +
    "Quantity: " + quantity + "\n" +
    "Pending transactions: " + queue.length;

  document.getElementById("partNumber").focus();

} // end testAdd()
// ============================================================
// TEST SYNC - ONE EXISTING OFFLINE TRANSACTION
// Test inventory ONLY. Does not modify the local queue.
// ============================================================

let queueTestSyncRunning = false;

async function syncPendingTest() {

  const status = document.getElementById("status");
  const button = document.getElementById("queueSyncTestButton");

  if (queueTestSyncRunning) return;

  try {

    const saved =
      localStorage.getItem("rapidAddOfflineQueueV1");

    const queue =
      saved === null ? [] : JSON.parse(saved);

    if (!Array.isArray(queue)) {
      throw new Error("Invalid offline queue.");
    }

    // Only allow our known test transaction.
    const matches = queue.filter(function(item) {
      return item.partNumber === "OFFLINE-TEST-001" &&
             item.location === "TEST" &&
             item.quantity === 1 &&
             item.action === "ADD" &&
             item.status === "PENDING" &&
             typeof item.id === "string" &&
             item.id.length > 0;
    });

    if (matches.length !== 1) {
      throw new Error(
        "Expected exactly one matching test transaction. Found: " +
        matches.length
      );
    }

    const transaction = matches[0];

    const endpoint =
      "https://script.google.com/macros/s/" +
      "AKfycbzzF0rS6uQhpQ1KE-wgI6mHj0aK3yRPs-UNWOPEoBp0IyOMi30TA-bY2IkkIqnTEJGz" +
      "/exec";

    const params = new URLSearchParams({
      action: "offlineTestAdd",
      transactionId: transaction.id,
      partNumber: transaction.partNumber,
      location: transaction.location,
      quantity: String(transaction.quantity),
      createdAt: transaction.createdAt || ""
    });

    const url = endpoint + "?" + params.toString();

    queueTestSyncRunning = true;
    button.disabled = true;

    status.innerText =
      "TEST SYNC IN PROGRESS\nDo not close this page.";

    // Navigate to the server response in a separate tab.
    // The original page and local queue remain unchanged.
    const responseTab = window.open(url, "_blank");

    if (!responseTab) {
      throw new Error(
        "Browser blocked the test response tab."
      );
    }

    status.innerText =
      "TEST SYNC REQUESTED\n" +
      "Check the response in the new tab.\n" +
      "Your pending queue has NOT been changed.";

  } catch (error) {

    status.innerText =
      "TEST SYNC NOT COMPLETED\n" +
      error.message;

  } finally {

    queueTestSyncRunning = false;
    button.disabled = false;

  }

} // end syncPendingTest()
    // ============================================================
// OFFLINE TRANSACTION STATUS VERIFICATION
// ============================================================
// ============================================================
// MANUAL SYNC CONFIRMATION - PREPARATION ONLY
// Does not modify inventory or the offline queue.
// ============================================================

function prepareManualSyncConfirmation() {
  const status = document.getElementById("status");

  try {
    // Locate our one verified test transaction.
    const transaction = getPendingTestTransaction();

    const message =
      "MANUAL SYNC CONFIRMATION\n\n" +
      "Part: " + transaction.partNumber + "\n" +
      "Location: " + transaction.location + "\n" +
      "Quantity: " + transaction.quantity + "\n" +
      "Transaction ID: " + transaction.id + "\n\n" +
      "Have you personally verified that Google Sheets " +
      "reports COMPLETED for this exact transaction?\n\n" +
      "Press OK only if your JSON backup is saved " +
      "and the server response is confirmed.";

    if (!window.confirm(message)) {
      status.innerText =
        "MANUAL CONFIRMATION CANCELLED\n" +
        "Local queue unchanged.";
      return;
    }

    const storageKey = "rapidAddOfflineQueueV1";
    const saved = localStorage.getItem(storageKey);

    if (saved === null) {
      throw new Error("Offline queue not found.");
    }

    const queue = JSON.parse(saved);

    if (!Array.isArray(queue)) {
      throw new Error("Invalid offline queue.");
    }

    const matches = queue.filter(function(item) {
      return item.id === transaction.id &&
        item.partNumber === "OFFLINE-TEST-001" &&
        item.location === "TEST" &&
        item.quantity === 1 &&
        item.action === "ADD" &&
        item.status === "PENDING";
    });

    if (matches.length !== 1) {
      throw new Error(
        "Expected exactly one matching pending transaction."
      );
    }

    // Preserve the transaction and its original information.
    // Change only its status.
    const updatedQueue = queue.map(function(item) {
      if (item === matches[0]) {
        return Object.assign({}, item, {
          status: "SYNCED"
        });
      }
      return item;
    });

    localStorage.setItem(
      storageKey,
      JSON.stringify(updatedQueue)
    );

    status.innerText =
      "MANUAL CONFIRMATION SAVED\n" +
      "Transaction: " + transaction.id + "\n" +
      "Local status: SYNCED\n" +
      "Original transaction preserved.\n" +
      "No inventory changes were sent.";

  } catch (error) {
    status.innerText =
      "MANUAL CONFIRMATION FAILED\n" +
      error.message;
  }
}
function getPendingTestTransaction() {

  const saved =
    localStorage.getItem("rapidAddOfflineQueueV1");

  const queue =
    saved === null ? [] : JSON.parse(saved);

  if (!Array.isArray(queue)) {
    throw new Error("Invalid offline queue.");
  }

  const matches = queue.filter(function(item) {
    return item.id ===
      "cdeaf090-fb00-4e9a-b2fe-2a9fc1e72895" &&
      item.partNumber === "OFFLINE-TEST-001" &&
      item.location === "TEST" &&
      item.quantity === 1 &&
      item.action === "ADD" &&
      item.status === "PENDING";
  });

  if (matches.length !== 1) {
    throw new Error(
      "Expected one matching pending test transaction. Found: " +
      matches.length
    );
  }

  return matches[0];

} // end getPendingTestTransaction()
    
function showSyncConfirmationInstructions() {

  const status = document.getElementById("status");

  try {

    // Identify the exact transaction stored on this phone.
    const transaction = getPendingTestTransaction();

    const endpoint =
      "https://script.google.com/macros/s/" +
      "AKfycbzzF0rS6uQhpQ1KE-wgI6mHj0aK3yRPs-UNWOPEoBp0IyOMi30TA-bY2IkkIqnTEJGz" +
      "/exec";

    const params = new URLSearchParams({
      action: "offlineSyncStatus",
      transactionId: transaction.id
    });

    const responseTab = window.open(
      endpoint + "?" + params.toString(),
      "_blank"
    );

    if (!responseTab) {
      throw new Error("Browser blocked the status tab.");
    }

    status.innerText =
      "STATUS CHECK REQUESTED\n" +
      "Read the server response in the new tab.\n" +
      "Local transaction remains PENDING.";

    status.innerText =
      "STATUS CHECK FAILED\n" +
      error.message;

window.addEventListener("message", function(event) {

  // Accept messages only from our own GitHub Pages site.
  if (event.origin !== window.location.origin) {
    return;
  }

  const data = event.data;

  if (!data || data.type !== "OFFLINE_SYNC_TEST") {
    return;
  }

  document.getElementById("status").innerText =
    "CONFIRMATION MESSAGE RECEIVED\n" +
    "Transaction: " + String(data.transactionId) + "\n" +
    "Status: " + String(data.status) + "\n" +
    "Local queue unchanged.";

});
