<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    #instruction {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    .field {
      text-align: left;
      margin: 15px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      font-size: 16px;
    }

    #available {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>Inventory Barcode Scanner</h2>

  <div id="instruction">
    Scan Part Number
  </div>

  <div id="reader"></div>

  <div class="field">
    <label for="partNumber">Part Number</label>

    <input
      type="text"
      id="partNumber"
      placeholder="Scan or enter part number">

    <button
      class="secondary"
      onclick="useManualPart()">
      USE PART NUMBER
    </button>
  </div>

  <div class="field">
    <label for="location">Location</label>

    <input
      type="text"
      id="location"
      placeholder="Scan or enter location">

    <button
      class="secondary"
      onclick="useManualLocation()">
      USE LOCATION
    </button>
  </div>

  <div id="available">
    Available: —
  </div>

  <div class="field">
    <label for="quantity">Quantity</label>

    <input
      type="number"
      id="quantity"
      min="1"
      value="1">
  </div>

  <button onclick="addInventory()">
    ADD INVENTORY
  </button>

  <div id="status"></div>


  <script>

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbzP6fN39s_66P2x8tFlwf_p1IFFUJ383K8ugae5IZmlL_4fysgETXR7-27Ks0OMvM4I/exec";


    let scanMode = "part";
    let scanLocked = false;


    function onScanSuccess(decodedText, decodedResult) {

      if (scanLocked) {
        return;
      }

      scanLocked = true;


      if (scanMode === "part") {

        document.getElementById("partNumber").value =
          decodedText;

        document.getElementById("instruction").innerText =
          "Now Scan Location";

        document.getElementById("status").innerText =
          "Part captured: " + decodedText;

        scanMode = "location";

        scanLocked = false;

        return;
      }


      if (scanMode === "location") {

        document.getElementById("location").value =
          decodedText;

        document.getElementById("instruction").innerText =
          "Part and Location Captured";

        document.getElementById("status").innerText =
          "Location captured: " + decodedText;

        scanMode = "complete";

        getQuantity();

      }

    }


    function onScanFailure(error) {
      // Keep scanning.
    }


    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 150
        },
        rememberLastUsedCamera: true
      },
      false
    );


    scanner.render(onScanSuccess, onScanFailure);


    function useManualPart() {

      const part =
        document.getElementById("partNumber").value.trim();

      if (!part) {

        document.getElementById("status").innerText =
          "Enter a part number first.";

        return;
      }

      scanMode = "location";

      document.getElementById("instruction").innerText =
        "Scan Location";

      document.getElementById("status").innerText =
        "Part entered: " + part;

    }


    function useManualLocation() {

      const location =
        document.getElementById("location").value.trim();

      const part =
        document.getElementById("partNumber").value.trim();

      if (!part) {

        document.getElementById("status").innerText =
          "Enter or scan the part number first.";

        return;
      }

      if (!location) {

        document.getElementById("status").innerText =
          "Enter a location first.";

        return;
      }

      scanMode = "complete";

      document.getElementById("instruction").innerText =
        "Part and Location Captured";

      getQuantity();

    }


    async function getQuantity() {

      const partNumber =
        document.getElementById("partNumber").value.trim();

      const location =
        document.getElementById("location").value.trim();


      if (!partNumber || !location) {
        return;
      }


      document.getElementById("available").innerText =
        "Checking inventory...";


      const url =
        WEB_APP_URL +
        "?action=getQuantity" +
        "&partNumber=" + encodeURIComponent(partNumber) +
        "&location=" + encodeURIComponent(location);


      try {

        const response = await fetch(url);

        const data = await response.json();


        if (data.success) {

          document.getElementById("available").innerText =
            "Available: " + data.quantity;

          document.getElementById("status").innerText =
            "Inventory lookup complete.";

        } else {

          document.getElementById("available").innerText =
            "Available: —";

          document.getElementById("status").innerText =
            "Error: " + data.message;

        }

      } catch (error) {

        document.getElementById("available").innerText =
          "Available: —";

        document.getElementById("status").innerText =
          "Connection error: " + error.message;

      }

    }


    async function addInventory() {

      const partNumber =
        document.getElementById("partNumber").value.trim();

      const location =
        document.getElementById("location").value.trim();

      const quantity =
        Number(document.getElementById("quantity").value);


      if (!partNumber) {

        document.getElementById("status").innerText =
          "Please enter or scan a part number.";

        return;
      }


      if (!location) {

        document.getElementById("status").innerText =
          "Please enter or scan a location.";

        return;
      }


      if (!quantity || quantity <= 0) {

        document.getElementById("status").innerText =
          "Please enter a valid quantity.";

        return;
      }


      document.getElementById("status").innerText =
        "Adding inventory...";


      const url =
        WEB_APP_URL +
        "?action=add" +
        "&partNumber=" + encodeURIComponent(partNumber) +
        "&location=" + encodeURIComponent(location) +
        "&quantity=" + encodeURIComponent(quantity);


      try {

        const response = await fetch(url);

        const data = await response.json();


        if (data.success) {

          document.getElementById("status").innerText =
            "Inventory added successfully!";

          document.getElementById("available").innerText =
            "Available: " + data.quantity;

          document.getElementById("quantity").value = 1;

          scanMode = "part";

          document.getElementById("instruction").innerText =
            "Scan Part Number";

          scanLocked = false;

        } else {

          document.getElementById("status").innerText =
            "Error: " + data.message;

        }

      } catch (error) {

        document.getElementById("status").innerText =
          "Connection error: " + error.message;

      }

    }

  </script>

</body>
</html>
