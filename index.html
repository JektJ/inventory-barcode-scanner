<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    #instruction {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
      padding: 16px;
      background-color: #f2f2f2;
      border: 2px solid #333;
      border-radius: 8px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    .field {
      text-align: left;
      margin: 15px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .action-buttons button {
      width: 33.33%;
    }

    .selected {
  outline: 4px solid #000;
  transform: scale(1.04);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
}
    .action-buttons button {
  transition: transform 0.15s ease,
              box-shadow 0.15s ease;
  border-radius: 6px;
}
    .secondary {
      font-size: 16px;
    }

    #available {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      white-space: pre-line;
    }
    .status-success {
  padding: 15px;
  border: 2px solid green;
  border-radius: 8px;
  background-color: #e8f5e9;
}

.status-error {
  padding: 15px;
  border: 2px solid red;
  border-radius: 8px;
  background-color: #ffebee;
}
  </style>
</head>

<body>

  <h2>Inventory Barcode Scanner</h2>


  <div class="field">

    <label>Action</label>

    <div class="action-buttons">

      <button
        id="addButton"
        onclick="selectAction('add')">
        ADD
      </button>

      <button
        id="removeButton"
        onclick="selectAction('remove')">
        REMOVE
      </button>

      <button
        id="moveButton"
        onclick="selectAction('move')">
        MOVE
      </button>

    </div>

  </div>


  <div id="instruction">
    Choose ADD, REMOVE, or MOVE
  </div>


  <div id="reader"></div>


  <div class="field">

    <label for="partNumber">
      Part Number
    </label>

    <input
      type="text"
      id="partNumber"
      placeholder="Scan or enter part number"
      oninput="this.value = this.value.toUpperCase()">
    
    <button
      class="secondary"
      onclick="useManualPart()">
      USE PART NUMBER
    </button>

  </div>


  <div class="field">

    <label for="location">
      <span id="locationLabel">Location</span>
    </label>

    <input
      type="text"
      id="location"
      placeholder="Scan or enter location"
      oninput="this.value = this.value.toUpperCase()">

    <button
      class="secondary"
      onclick="useManualLocation()">
      USE LOCATION
    </button>

  </div>


  <div
    class="field"
    id="toLocationField"
    style="display:none;">

    <label for="toLocation">
      To Location
    </label>

    <input
      type="text"
      id="toLocation"
      placeholder="Scan or enter destination location"
      oninput="this.value = this.value.toUpperCase()">

    <button
      class="secondary"
      onclick="useManualToLocation()">
      USE TO LOCATION
    </button>

  </div>


  <div id="available">
    Available: —
  </div>


  <div class="field">

    <label for="quantity">
      Quantity
    </label>

    <input
      type="number"
      id="quantity"
      min="1"
      value="1">

  </div>


  <button
  id="processButton"
  onclick="processInventory()">
  PROCESS INVENTORY
  </button>


  <div id="status"></div>


  <script>

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbzP6fN39s_66P2x8tFlwf_p1IFFUJ383K8ugae5IZmlL_4fysgETXR7-27Ks0OMvM4I/exec";


    let selectedAction = "";

    let scanMode = "part";

    let scanLocked = false;


    function selectAction(action) {

      selectedAction = action;
      document.getElementById("status").classList.remove(
        "status-success",
        "status-error"
      );
      
      document.getElementById("status").innerText = "";

      document
        .getElementById("addButton")
        .classList.remove("selected");

      document
        .getElementById("removeButton")
        .classList.remove("selected");

      document
        .getElementById("moveButton")
        .classList.remove("selected");


      if (action === "add") {

        document
          .getElementById("addButton")
          .classList.add("selected");

      }


      if (action === "remove") {

        document
          .getElementById("removeButton")
          .classList.add("selected");

      }


      if (action === "move") {

        document
          .getElementById("moveButton")
          .classList.add("selected");

      }


      if (action === "move") {

        document
          .getElementById("toLocationField")
          .style.display = "block";

      } else {

        document
          .getElementById("toLocationField")
          .style.display = "none";

      }
      // ============================================================
      // START A FRESH TRANSACTION
      // Clicking ADD, REMOVE, or MOVE also acts as a reset.
      // ============================================================

      document.getElementById("partNumber").value = "";
      document.getElementById("location").value = "";
      document.getElementById("toLocation").value = "";
      document.getElementById("quantity").value = 1;


      scanMode = "part";

      scanLocked = false;


      document.getElementById("available").innerText =
        "Available: —";


      document.getElementById("instruction").innerText =
        "Scan Part Number";


      document.getElementById("status").innerText =
        action === "add"
          ? "ADD selected."
          : action === "remove"
          ? "REMOVE selected."
          : "MOVE selected.";

    }


  function onScanSuccess(decodedText, decodedResult) {

  // ============================================================
  // IGNORE SCANS WHILE THE CURRENT VALUE IS WAITING FOR CONFIRMATION
  // ============================================================

  if (scanLocked) {
    return;
  } // end scanLocked check


  // ============================================================
  // REQUIRE AN INVENTORY ACTION FIRST
  // ============================================================

  if (!selectedAction) {

    document.getElementById("status").innerText =
      "Please choose ADD, REMOVE, or MOVE first.";

    return;

  } // end selectedAction check


  // ============================================================
  // PART NUMBER SCAN
  // Capture ONE part number, then lock scanning.
  // USE PART NUMBER will unlock the scanner for Location.
  // ============================================================

  if (scanMode === "part") {

    document.getElementById("partNumber").value =
      decodedText.toUpperCase();

    document.getElementById("instruction").innerText =
      "Confirm Part Number";

    document.getElementById("status").innerText =
      "Part captured: " + decodedText.toUpperCase();

    scanLocked = true;

    return;

  } // end Part Number scan


  // ============================================================
  // LOCATION SCAN
  // We are leaving this behavior unchanged for this test.
  // ============================================================

  if (scanMode === "location") {

    document.getElementById("location").value =
      decodedText.toUpperCase();


    if (selectedAction === "move") {

      document.getElementById("instruction").innerText =
        "Scan To Location";

      document.getElementById("status").innerText =
        "From location captured: " + decodedText.toUpperCase();

      scanMode = "toLocation";

      scanLocked = false;

      getQuantity();

      return;

    } // end MOVE location handling


    document.getElementById("instruction").innerText =
      "Part and Location Captured";

    document.getElementById("status").innerText =
      "Location captured: " + decodedText.toUpperCase();

    scanMode = "complete";

    if (selectedAction !== "add") {
        getQuantity();
    } // end inventory lookup check

  // ============================================================
  // TO LOCATION SCAN
  // Used only for MOVE.
  // ============================================================

  if (scanMode === "toLocation") {

    document.getElementById("toLocation").value =
      decodedText.toUpperCase();

    document.getElementById("instruction").innerText =
      "Move Ready";

    document.getElementById("status").innerText =
      "To location captured: " + decodedText.toUpperCase();

    scanMode = "complete";

  } // end To Location scan

} // end onScanSuccess()

    function onScanFailure(error) {
      // Keep scanning.
    }


    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 5,
        qrbox: {
          width: 250,
          height: 250
        },
                
        rememberLastUsedCamera: true
        //showZoomSliderIfSupported: true
      },
      false
    );


    scanner.render(onScanSuccess, onScanFailure);


    function useManualPart() {

      const part =
        document.getElementById("partNumber").value.trim();


      if (!selectedAction) {

        document.getElementById("status").innerText =
          "Please choose an action first.";

        return;
      }


      if (!part) {

        document.getElementById("status").innerText =
          "Enter a part number first.";

        return;
      }


      scanMode = "location";
      
      scanLocked = false;

      document.getElementById("instruction").innerText =
        selectedAction === "move"
          ? "Scan From Location"
          : "Scan Location";


      document.getElementById("status").innerText =
        "Part entered: " + part;

    }


    function useManualLocation() {

      const location =
        document.getElementById("location").value.trim();


      const part =
        document.getElementById("partNumber").value.trim();


      if (!selectedAction) {

        document.getElementById("status").innerText =
          "Please choose an action first.";

        return;
      }


      if (!part) {

        document.getElementById("status").innerText =
          "Enter or scan the part number first.";

        return;
      }


      if (!location) {

        document.getElementById("status").innerText =
          "Enter a location first.";

        return;
      }


      if (selectedAction === "move") {

        scanMode = "toLocation";


        document.getElementById("instruction").innerText =
          "Scan To Location";


        document.getElementById("status").innerText =
          "From location entered: " + location;


        getQuantity();

        return;
      }


      scanMode = "complete";


      document.getElementById("instruction").innerText =
        "Part and Location Captured";


      // ADD does not need an inventory lookup.
      // REMOVE still checks the current available quantity.
      if (selectedAction !== "add") {
        getQuantity();
      } // end inventory lookup check

    function useManualToLocation() {

      const toLocation =
        document.getElementById("toLocation").value.trim();


      if (!toLocation) {

        document.getElementById("status").innerText =
          "Enter a destination location first.";

        return;
      }


      scanMode = "complete";


      document.getElementById("instruction").innerText =
        "Move Ready";


      document.getElementById("status").innerText =
        "To location entered: " + toLocation;

    }


    async function getQuantity() {

  const partNumber =
    document.getElementById("partNumber").value.trim();

  const location =
    document.getElementById("location").value.trim();

  if (!partNumber || !location) {
    return;
  }

  document.getElementById("available").innerText =
    "Checking inventory...";

  const url =
    WEB_APP_URL +
    "?action=getQuantity" +
    "&partNumber=" +
    encodeURIComponent(partNumber) +
    "&location=" +
    encodeURIComponent(location);

  try {

    const response = await fetch(url);
    const data = await response.json();

    if (data.success) {

      document.getElementById("available").innerText =
        "Available: " + data.quantity;

      document.getElementById("status").innerText =
        "Inventory lookup complete.";

    } else {

      document.getElementById("available").innerText =
        "Available: —";

      document.getElementById("status").innerText =
        "Error: " + data.message;
    }

  } catch (error) {

    document.getElementById("available").innerText =
      "Available: —";

    document.getElementById("status").innerText =
      "Connection error: " + error.message;
  }
}


function resetFormAfterSuccess() {

  document.getElementById("partNumber").value = "";
  document.getElementById("location").value = "";
  document.getElementById("toLocation").value = "";
  document.getElementById("quantity").value = 1;

  scanMode = "part";
  scanLocked = false;

  document.getElementById("instruction").innerText =
    "Scan Part Number";
}
    async function processInventory() {

  // ============================================================
  // READ VALUES FROM THE FORM
  // ============================================================

  const partNumber =
    document.getElementById("partNumber").value.trim();

  const location =
    document.getElementById("location").value.trim();

  const toLocation =
    document.getElementById("toLocation").value.trim();

  const quantity =
    Number(document.getElementById("quantity").value);


  // ============================================================
  // VALIDATE USER INPUT
  // Stop immediately if something important is missing.
  // ============================================================

  if (!selectedAction) {

    document.getElementById("status").innerText =
      "Please choose ADD, REMOVE, or MOVE.";

    return;

  } // end selectedAction check


  if (!partNumber) {

    document.getElementById("status").innerText =
      "Please enter or scan a part number.";

    return;

  } // end part number check


  if (!location) {

    document.getElementById("status").innerText =
      selectedAction === "move"
        ? "Please enter the FROM location."
        : "Please enter or scan a location.";

    return;

  } // end location check


  if (
    selectedAction === "move" &&
    !toLocation
  ) {

    document.getElementById("status").innerText =
      "Please enter the TO location.";

    return;

  } // end MOVE destination check


  if (
    selectedAction === "move" &&
    location === toLocation
  ) {

    document.getElementById("status").innerText =
      "FROM and TO locations cannot be the same.";

    return;

  } // end same-location check


  if (!quantity || quantity <= 0) {

    document.getElementById("status").innerText =
      "Please enter a valid quantity.";

    return;

  } // end quantity check


  // ============================================================
  // PREVENT DOUBLE SUBMISSION
  // Disable the button while the request is being processed.
  // ============================================================

  const processButton =
    document.getElementById("processButton");

  processButton.disabled = true;

  processButton.innerText =
    "PROCESSING...";


  // Remove any old success/error styling before starting.
  document.getElementById("status").classList.remove(
    "status-success",
    "status-error"
  );


  // Show the operator what the system is doing.
  document.getElementById("status").innerText =
    selectedAction === "add"
      ? "Adding inventory..."
      : selectedAction === "remove"
      ? "Removing inventory..."
      : "Moving inventory...";


  // ============================================================
  // BUILD THE REQUEST URL
  // This sends the inventory request to Google Apps Script.
  // ============================================================

  let url =
    WEB_APP_URL +
    "?action=" +
    encodeURIComponent(selectedAction) +
    "&partNumber=" +
    encodeURIComponent(partNumber) +
    "&location=" +
    encodeURIComponent(location) +
    "&quantity=" +
    encodeURIComponent(quantity);


  // MOVE needs one extra value: the destination location.
  if (selectedAction === "move") {

    url +=
      "&toLocation=" +
      encodeURIComponent(toLocation);

  } // end MOVE URL addition


  // ============================================================
  // SEND REQUEST TO GOOGLE APPS SCRIPT
  // ============================================================

  try {

    const response =
      await fetch(url);

    const data =
      await response.json();


    // ==========================================================
    // HANDLE SUCCESS
    // ==========================================================

    if (data.success) {

      document.getElementById("status")
        .classList.remove("status-error");

      document.getElementById("status")
        .classList.add("status-success");


      // --------------------------------------------------------
      // ADD SUCCESS
      // --------------------------------------------------------

      if (selectedAction === "add") {

        document.getElementById("status").innerText =
          "ADD COMPLETE\n" +
          "Part: " + partNumber + "\n" +
          "Location: " + location + "\n" +
          "Quantity added: " + quantity + "\n" +
          "Available now: " + data.quantity;

        document.getElementById("available").innerText =
          "Available: " + data.quantity;


      // --------------------------------------------------------
      // REMOVE SUCCESS
      // --------------------------------------------------------

      } else if (selectedAction === "remove") {

        document.getElementById("status").innerText =
          "REMOVE COMPLETE\n" +
          "Part: " + partNumber + "\n" +
          "Location: " + location + "\n" +
          "Quantity removed: " + quantity + "\n" +
          "Available now: " + data.quantity;

        document.getElementById("available").innerText =
          "Available: " + data.quantity;


      // --------------------------------------------------------
      // MOVE SUCCESS
      // --------------------------------------------------------

      } else if (selectedAction === "move") {

        document.getElementById("status").innerText =
          "MOVE COMPLETE\n" +
          "Part: " + partNumber + "\n" +
          "From: " + location + "\n" +
          "To: " + toLocation + "\n" +
          "Quantity moved: " + quantity + "\n" +
          "Available at destination: " + data.toQuantity;

        document.getElementById("available").innerText =
          "Available at " +
          toLocation +
          ": " +
          data.toQuantity;

      } // end selectedAction success handling


      // Clear form fields after a successful transaction.
      resetFormAfterSuccess();


    // ==========================================================
    // HANDLE API ERROR
    // The request worked, but the backend rejected the action.
    // Example: trying to remove more inventory than exists.
    // ==========================================================

    } else {

      document.getElementById("status")
        .classList.remove("status-success");

      document.getElementById("status")
        .classList.add("status-error");

      document.getElementById("status").innerText =
        "ERROR\n" + data.message;

    } // end data.success check


  // ============================================================
  // HANDLE CONNECTION OR JAVASCRIPT ERRORS
  // ============================================================

  } catch (error) {

    document.getElementById("status")
      .classList.remove("status-success");

    document.getElementById("status")
      .classList.add("status-error");

    document.getElementById("status").innerText =
      "CONNECTION ERROR\n" + error.message;


  // ============================================================
  // ALWAYS RUN THIS
  // Whether success or failure, re-enable the button.
  // ============================================================

  } finally {

    processButton.disabled = false;

    processButton.innerText =
      "PROCESS INVENTORY";

  } // end try / catch / finally

} // end processInventory()
  </script>

</body>
</html>
